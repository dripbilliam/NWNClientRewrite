<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/style.css"><style>body{background:#18231f}#fixture{position:absolute;left:10px;top:10px;width:1100px;height:780px;overflow:hidden}#world{position:absolute;inset:0;width:100%;height:100%}.network-panels[data-panel=map]{height:350px;width:350px}.network-panels[data-panel=character]{height:400px;width:350px}.network-inventory{height:430px;width:350px}.network-spell-window{height:350px;width:300px;flex-shrink:0}header{background:#17271d;color:white}.network-spellbooks{height:350px}</style></head><body><main id="fixture"><canvas id="world" tabindex="-1"></canvas><section class="network-panels" data-panel="character"><article class="character-record"><header class="record-title"><span>Character Record</span><button>×</button></header><p>Character details</p><button data-action>Action</button></article></section><section class="network-inventory"><header><h2>Inventory</h2><button>×</button></header><button draggable="true" data-item>Equipment item</button></section><section class="network-panels" data-panel="spells"><div class="network-spellbooks"><section class="network-spell-window network-known-spells"><header><h2>Known Spells</h2><button>×</button></header><button data-spell>Spell</button></section><section class="network-spell-window network-memorized-spells"><header><h2>Memorize Spells</h2><button>×</button></header></section></div></section></main><script type="module">
