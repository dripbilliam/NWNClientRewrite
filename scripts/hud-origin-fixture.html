<script type="module">
import * as THREE from 'three';import {TGALoader} from 'three/addons/loaders/TGALoader.js';import {NativeUiAssets} from '../src/native_ui_assets.js';import {loadRasterTexture} from '../src/raster_texture.js';import {GAME_HUD_ACTIONS} from '../src/game_hud_actions.js';
window.runHudOriginFixture=async()=>{const results=[];for(const [label,context,old]of [['Installed native','installed',false],['Workshop before fix','mods',true],['Workshop native rows','mods',false]]){const resolver={getResource:(n,t)=>creationFixture.resource(context+'|'+n,t),getTextureResource:n=>creationFixture.texture(context+'|'+n)},assets=new NativeUiAssets(resolver);if(old)assets.texture=function(name){name=name.toLowerCase();if(!this.textures.has(name))this.textures.set(name,(async()=>{const r=await resolver.getTextureResource(name);let t;if(r.type===3){const im=new TGALoader().parse(r.bytes);t=new THREE.DataTexture(im.data,im.width,im.height,THREE.RGBAFormat);t.flipY=im.flipY;}else t=await loadRasterTexture(resolver,name);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=t.minFilter=THREE.LinearFilter;t.needsUpdate=true;return t;})());return this.textures.get(name);};const panel=document.createElement('section'),title=document.createElement('h2'),nav=document.createElement('nav');title.textContent=label;panel.append(title,nav);document.body.append(panel);const icons=[];for(const [id,name,model]of GAME_HUD_ACTIONS){const skin=await assets.skin(model),img=document.createElement('img');img.src=skin.url;img.alt=name;img.title=name;await img.decode();nav.append(img);icons.push({id,width:skin.width,height:skin.height,url:skin.url});}results.push({label,icons});assets.dispose();}return results;};
</script>
