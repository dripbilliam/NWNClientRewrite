<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/network_nui.css"></head><body style="margin:0;background:#17251d"><div id="viewport" style="position:relative;width:100vw;height:100vh"></div><script type="module">
import {NetworkNuiView} from '../src/network_nui_view.js';import {NuiState} from '../src/nui_state.js';window.fixtureErrors=[];window.fixtureMeasurements=[];window.fixtureMessages=[];window.fixtureWorld={nui:new NuiState()};window.ui=new NetworkNuiView(document.querySelector('#viewport'),{world:()=>fixtureWorld,input:async request=>{const result=await nuiFixture.input(request);if((request.events??[]).some(e=>e.type==='close')&&fixtureWorld.nui.windows.get(request.token)?.serial===request.serial){fixtureWorld.nui.apply({kind:'nui-destroy',token:request.token});ui.sync();}return result;},report:(code,message,data)=>{if(code.endsWith('-failed'))fixtureErrors.push({code,message,data});else fixtureMeasurements.push({code,...data});}});nuiFixture.onMessage(message=>{fixtureMessages.push(message.kind);fixtureWorld.nui.apply(message);ui.sync();});window.fixtureReady=true;
</script></body></html>
