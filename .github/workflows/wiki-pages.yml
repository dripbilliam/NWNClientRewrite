name: Build and publish research wiki

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['**.md', '**/*.md', 'wiki/**', '.github/workflows/wiki-pages.yml']
  pull_request:
    paths: ['**.md', '**/*.md', 'wiki/**', '.github/workflows/wiki-pages.yml']

permissions:
  contents: read

concurrency:
  group: wiki-pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - name: Install wiki dependencies
        run: npm ci --prefix wiki --ignore-scripts
      - name: Test link resolver and search
        run: npm test --prefix wiki
      - name: Build static wiki
        run: npm run build --prefix wiki
      - name: Check generated links and backlinks
        run: npm run check --prefix wiki
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: wiki/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
